<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First App</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    h1 { color: #a78bfa; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; border: none; border-radius: 8px;
             background: #a78bfa; color: #0f172a; cursor: pointer; }
    #result { margin-top: 1.5rem; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>My First App</h1>
  <button id="btn">Ask the server</button>
  <div id="result"></div>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      const response = await fetch('/api/hello');
      const data = await response.json();
      document.getElementById('result').innerHTML =
        `${data.message}<br>Server time: ${data.serverTime}<br>Visits: ${data.visits}`;
    });
  </script>
</body>
</html>
